<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>Scanner — Lynda & Marcel-Cédric</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;min-height:100dvh;background:#1a1a2e;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;}
#app{width:100%;max-width:430px;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;}

/* PIN */
#pin-screen{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;}
.pin-title{font-family:'Dancing Script',cursive;font-size:28px;color:rgba(255,240,220,.9);text-align:center;}
.pin-sub{font-size:12px;font-style:italic;color:rgba(255,240,220,.45);text-align:center;}
#pin-row{display:flex;gap:12px;justify-content:center;}
.pd{width:52px;height:60px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,220,180,.2);border-radius:12px;text-align:center;font-size:26px;font-weight:700;color:#fff5ee;outline:none;transition:border-color .2s;}
.pd:focus{border-color:rgba(255,180,100,.6);}
.pd.err{border-color:rgba(220,60,60,.7);animation:errShake .3s;}
#pin-btn{width:100%;max-width:260px;padding:13px;background:linear-gradient(135deg,#c2410c,#9a3412);border:none;border-radius:12px;color:#fff5ee;font-family:Georgia,serif;font-size:16px;cursor:pointer;}
#pin-err{font-size:12px;color:rgba(220,80,60,.8);font-style:italic;min-height:16px;text-align:center;}

/* SCANNER */
#scan-screen{display:none;flex-direction:column;align-items:center;width:100%;gap:16px;}
.scan-title{font-family:'Dancing Script',cursive;font-size:24px;color:rgba(255,240,220,.85);text-align:center;}
#cam-wrap{position:relative;width:100%;max-width:340px;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#000;}
#cam{width:100%;height:100%;object-fit:cover;display:block;}
#cam-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.scan-frame{width:200px;height:200px;border:2.5px solid rgba(255,180,80,.7);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);}
.scan-line{position:absolute;width:180px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,180,80,.9),transparent);animation:scanLine 2s ease-in-out infinite;}
@keyframes scanLine{0%,100%{top:calc(50% - 90px)}50%{top:calc(50% + 90px)}}

/* Résultat */
#result-wrap{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;z-index:50;transition:background .3s;}
#result-wrap.granted{background:rgba(20,100,40,.96);}
#result-wrap.already{background:rgba(140,40,20,.96);}
#result-wrap.unconfirmed{background:rgba(140,100,10,.96);}
#result-wrap.invalid{background:rgba(40,40,50,.96);}
#result-icon{font-size:80px;margin-bottom:16px;}
#result-name{font-family:'Dancing Script',cursive;font-size:42px;color:#fff;margin-bottom:8px;}
#result-status{font-size:18px;color:rgba(255,255,255,.9);line-height:1.6;font-style:italic;}
#result-time{font-size:13px;font-style:italic;color:rgba(255,255,255,.55);margin-top:10px;}
.scan-count{font-size:11px;font-style:italic;color:rgba(255,240,220,.35);text-align:center;}

/* NAV ONGLETS */
#main-nav{display:none;width:100%;max-width:430px;border-bottom:1px solid rgba(255,220,180,.15);background:rgba(0,0,0,.25);position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:100;}
#main-nav.show{display:flex;}
.mnv{flex:1;padding:11px 8px 9px;text-align:center;font-family:'Dancing Script',cursive;font-size:15px;color:rgba(255,240,220,.4);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;}
.mnv.on{color:rgba(255,200,120,.9);border-bottom-color:rgba(255,180,80,.7);}

/* VUE PLAN */
#vue-plan{display:none;width:100%;max-width:430px;padding:60px 16px 32px;min-height:100vh;}
.vue-title{font-family:'Dancing Script',cursive;font-size:24px;color:rgba(255,240,220,.85);margin-bottom:14px;text-align:center;}
.plan-card{background:rgba(255,252,248,.12);border:1px solid rgba(255,220,180,.18);border-radius:16px;padding:14px 10px;}
#plan-svg{width:100%;max-width:380px;display:block;margin:0 auto;}
.plan-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:11px;font-style:italic;color:rgba(255,240,220,.5);}
.leg-item{display:flex;align-items:center;gap:5px;}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.leg-rect{width:14px;height:9px;border-radius:2px;flex-shrink:0;}

/* Table résultat dans écran granted */
#result-table{font-family:'Dancing Script',cursive;font-size:52px;color:#fff;line-height:1;margin-bottom:2px;display:none;}
#result-places{font-size:15px;color:rgba(255,255,255,.8);font-style:italic;margin-bottom:8px;display:none;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">

  <!-- PIN -->
  <div id="pin-screen">
    <div class="pin-title">Contrôle d'accès</div>
    <div class="pin-sub">Lynda &amp; Marcel-Cédric · 15 & 16 mai 2026</div>
    <div id="pin-row">
      <input class="pd" id="p0" maxlength="1" type="tel" inputmode="numeric">
      <input class="pd" id="p1" maxlength="1" type="tel" inputmode="numeric">
      <input class="pd" id="p2" maxlength="1" type="tel" inputmode="numeric">
      <input class="pd" id="p3" maxlength="1" type="tel" inputmode="numeric">
    </div>
    <div id="pin-err"></div>
    <button id="pin-btn">Accéder au scanner</button>
  </div>

  <!-- SCANNER -->
  <div id="scan-screen">
    <button id="logout-btn">⏻ Quitter</button>
    <div class="scan-title">Scanner l'invitation</div>
    <div id="cam-wrap">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="cam-canvas" style="display:none;"></canvas>
      <div id="cam-overlay"><div class="scan-frame"></div><div class="scan-line"></div></div>
    </div>
    <div id="result-wrap">
      <div id="result-table"></div>
      <div id="result-places"></div>
      <div id="result-icon"></div>
      <div id="result-name"></div>
      <div id="result-status"></div>
      <div id="result-time"></div>
    </div>
    <div class="scan-count" id="scan-count">En attente de scan…</div>
  </div>

</div>

<!-- NAV (visible après PIN) -->
<div id="main-nav">
  <div class="mnv on" onclick="showVue('scan')">📷 Scanner</div>
  <div class="mnv" onclick="showVue('plan')">🗺 Plan</div>
</div>

<!-- VUE PLAN -->

      <g id="pt-2" style="cursor:pointer" onclick="hlTable(2)"><circle cx="255" cy="75" r="32" fill="rgba(255,252,248,.12)" stroke="rgba(255,220,180,.3)" stroke-width="1"/><text x="255" y="71" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,240,220,.85)" font-family="Georgia,serif">T2</text><text x="255" y="84" text-anchor="middle" font-size="9" fill="rgba(255,240,220,.45)" font-family="Georgia,serif">9 pl.</text></g>
      <!-- R2 : T3 · T4 · T5 -->
      <g id="pt-3" style="cursor:pointer" onclick="hlTable(3)"><circle cx="65" cy="185" r="32" fill="rgba(255,252,248,.12)" stroke="rgba(255,220,180,.3)" stroke-width="1"/><text x="65" y="181" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,240,220,.85)" font-family="Georgia,serif">T3</text><text x="65" y="194" text-anchor="middle" font-size="9" fill="rgba(255,240,220,.45)" font-family="Georgia,serif">9 pl.</text></g>
      <g id="pt-4" style="cursor:pointer" onclick="hlTable(4)"><circle cx="160" cy="185" r="32" fill="rgba(255,252,248,.12)" stroke="rgba(255,220,180,.3)" stroke-width="1"/><text x="160" y="181" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,240,220,.85)" font-family="Georgia,serif">T4</text><text x="160" y="194" text-anchor="middle" font-size="9" fill="rgba(255,240,220,.45)" font-family="Georgia,serif">9 pl.</text></g>
      <g id="pt-5" style="cursor:pointer" onclick="hlTable(5)"><circle cx="255" cy="185" r="32" fill="rgba(255,252,248,.12)" stroke="rgba(255,220,180,.3)" stroke-width="1"/><text x="255" y="181" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,240,220,.85)" font-family="Georgia,serif">T5</text><text x="255" y="194" text-anchor="middle" font-size="9" fill="rgba(255,240,220,.45)" font-family="Georgia,serif">9 pl.</text></g>
      <!-- R3 : T6 · T7 · T8 -->
      <g id="pt-6" style="cursor:pointer" onclick="hlTable(6)"><circle cx="65" cy="295" r="32" fill="rgba(255,252,248,.12)" stroke="rgba(255,220,180,.3)" stroke-width="1"/><text x="65" y="291" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,240,220,.85)" font-family="Georgia,serif">T6</text><text x="65" y="304" text-anchor="middle" font-size="9" fill="rgba(255,240,220,.45)" font-family="Georgia,serif">9 pl.</text></g>
      <g id="pt-7" style="cursor:pointer" onclick="hlTable(7)"><circle cx="160" cy="295" r="32" fill="rgba(255,252,248,.12)" stroke="rgba(255,220,180,.3)" stroke-width="1"/><text x="160" y="291" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,240,220,.85)" font-family="Georgia,serif">T7</text><text x="160" y="304" text-anchor="middle" font-size="9" fill="rgba(255,240,220,.45)" font-family="Georgia,serif">9 pl.</text></g>
      <g id="pt-8" style="cursor:pointer" onclick="hlTable(8)"><circle cx="255" cy="295" r="32" fill="rgba(255,252,248,.12)" stroke="rgba(255,220,180,.3)" stroke-width="1"/><text x="255" y="291" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,240,220,.85)" font-family="Georgia,serif">T8</text><text x="255" y="304" text-anchor="middle" font-size="9" fill="rgba(255,240,220,.45)" font-family="Georgia,serif">9 pl.</text></g>
      <!-- R4 : T9 · T10 · T11 -->
      <g id="pt-9" style="cursor:pointer" onclick="hlTable(9)"><circle cx="65" cy="400" r="32" fill="rgba(255,252,248,.12)" stroke="rgba(255,220,180,.3)" stroke-width="1"/><text x="65" y="396" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,240,220,.85)" font-family="Georgia,serif">T9</text><text x="65" y="409" text-anchor="middle" font-size="9" fill="rgba(255,240,220,.45)" font-family="Georgia,serif">9 pl.</text></g>
      <g id="pt-10" style="cursor:pointer" onclick="hlTable(10)"><circle cx="160" cy="400" r="32" fill="rgba(255,252,248,.12)" stroke="rgba(255,220,180,.3)" stroke-width="1"/><text x="160" y="396" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,240,220,.85)" font-family="Georgia,serif">T10</text><text x="160" y="409" text-anchor="middle" font-size="9" fill="rgba(255,240,220,.45)" font-family="Georgia,serif">9 pl.</text></g>

    <div class="plan-legend">

      <div class="leg-item"><div class="leg-rect" style="background:rgba(250,238,218,.3);border:1px solid rgba(186,117,23,.6);"></div>Mariés</div>

    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
(function(){
  var scannerPin = '';
  var scanCount = 0;
  var lastScan = '';
  var lastScanTime = 0;
  var scanCooldown = 3000;
  var scanActive = true;
  var animTimer = null;

  /* ── PIN ── */
  var pds = ['p0','p1','p2','p3'].map(function(id){return document.getElementById(id);});
  pds.forEach(function(inp,i){
    inp.addEventListener('keydown',function(e){
      if(e.key==='Backspace'){
        if(inp.value){inp.value='';}
        else if(i>0){pds[i-1].focus();pds[i-1].value='';}
        e.preventDefault();
      }
      if(e.key==='Enter') checkPin();
    });
    inp.addEventListener('input',function(){
      var v=inp.value.replace(/\D/g,'').slice(-1);inp.value=v;
      if(v&&i<3)pds[i+1].focus();
    });
  });
  document.getElementById('pin-btn').addEventListener('click', checkPin);

  function checkPin(){
    var c=pds.map(function(d){return d.value;}).join('');
    if(c.length<4){pds.forEach(function(d){d.classList.add('err');setTimeout(function(){d.classList.remove('err');},300);});return;}
    scannerPin=c;
    startScanner();
  }

  /* ── SCANNER ── */
  function startScanner(){
    document.getElementById('pin-screen').style.display='none';
    var ss=document.getElementById('scan-screen');ss.style.display='flex';
    var video=document.getElementById('cam');
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}})
    .then(function(stream){
      video.srcObject=stream;
      video.play();
      requestAnimationFrame(tick);
    })
    .catch(function(e){
      document.getElementById('scan-count').textContent='Erreur caméra : '+e.message;
    });
  }

  function tick(){
    var video=document.getElementById('cam');
    var canvas=document.getElementById('cam-canvas');
    if(video.readyState===video.HAVE_ENOUGH_DATA && scanActive){
      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      var imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
      var code=jsQR(imageData.data,imageData.width,imageData.height,{inversionAttempts:'dontInvert'});
      if(code && code.data){
        var now=Date.now();
        if(code.data!==lastScan||now-lastScanTime>scanCooldown){
          lastScan=code.data;lastScanTime=now;
          processQR(code.data);
        }
      }
    }
    requestAnimationFrame(tick);
  }

  function processQR(data){
    try{
      var url=new URL(data);
      var shortMatch = url.pathname.match(/\/s\/([A-Z0-9]{8})$/i);
      var guestToken, evt, shortCode;

      if(shortMatch){
        /* URL courte /s/XXXXXXXX — envoyer shortCode directement à check-entry */
        shortCode = shortMatch[1].toUpperCase();
      } else {
        /* URL longue ?g=TOKEN&e=ck1 */
        guestToken = url.searchParams.get('g');
        evt        = url.searchParams.get('e');
        if(!guestToken||!evt){showResult('invalid',{});return;}
      }

      scanActive=false;
      fetch('/.netlify/functions/check-entry',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({guestToken:guestToken, shortCode:shortCode, event:evt, pin:scannerPin})
      })
      .then(function(r){return r.json();})
      .then(function(data){
        if(data.error==='PIN invalide'){
          document.getElementById('pin-screen').style.display='flex';
          document.getElementById('scan-screen').style.display='none';
          document.getElementById('pin-err').textContent='PIN invalide — reconnectez-vous';
          scannerPin='';
          pds.forEach(function(d){d.value='';});
          return;
        }
        showResult(data.status,data);
        scanCount++;
        document.getElementById('scan-count').textContent=scanCount+' scan'+(scanCount>1?'s':'')+' effectué'+(scanCount>1?'s':'');
        clearTimeout(animTimer);
        animTimer=setTimeout(function(){
          document.getElementById('result-wrap').style.display='none';
          var rt=document.getElementById('result-table');
          var rp=document.getElementById('result-places');
          if(rt){rt.style.display='none';rt.textContent='';}
          if(rp){rp.style.display='none';rp.textContent='';}
          scanActive=true;
          lastScan='';
        },3000);
      })
      .catch(function(e){showResult('invalid',{});scanActive=true;});
    }catch(e){showResult('invalid',{});scanActive=true;}
  }

  function showResult(status,data){
    var wrap=document.getElementById('result-wrap');
    var icon=document.getElementById('result-icon');
    var name=document.getElementById('result-name');
    var st=document.getElementById('result-status');
    var tm=document.getElementById('result-time');
    wrap.className='';wrap.style.display='block';

    var evtLabel=data.event==='ck1'?'Cocktail famille':'Repas de mariage';

    if(status==='granted'){
      wrap.classList.add('granted');
      icon.textContent='✅';
      name.textContent=data.prenom||'';
      st.textContent='Accès '+evtLabel+' autorisé';
      tm.textContent=data.scanned_at||'';
      /* Afficher table + places si repas samedi */
      var rt=document.getElementById('result-table');
      var rp=document.getElementById('result-places');
      if(data.event==='ck2'&&data.table&&rt&&rp){
        rt.textContent=data.table;rt.style.display='block';
        rp.textContent='Places restantes : '+(data.placesRestantes!=null?data.placesRestantes:'—')+' / 9';
        rp.style.display='block';
        hlTableByName(data.table);
      }
    } else if(status==='already_scanned'){
      wrap.classList.add('already');
      icon.textContent='🔴';
      name.textContent=data.prenom||'';
      st.textContent='Déjà enregistré — '+evtLabel;
      tm.textContent='Premier accès le '+data.scanned_at;
    } else if(status==='unconfirmed'){
      wrap.classList.add('unconfirmed');
      icon.textContent='⚠️';
      name.textContent=data.prenom||'';
      st.textContent='Invité non confirmé';
      tm.textContent=data.reason||'';
    } else {
      wrap.classList.add('invalid');
      icon.textContent='❌';
      name.textContent='';
      st.textContent='QR code invalide';
      tm.textContent='';
    }

    wrap.style.animation='none';void wrap.offsetWidth;wrap.style.animation='popIn .35s cubic-bezier(.2,0,.2,1)';
  }

  document.getElementById('logout-btn').addEventListener('click',function(){
    location.reload();
  });

})();

/* ── NAV + PLAN (ajouts sans régression) ── */
function showVue(v){
  document.getElementById('app').style.display = v==='scan' ? 'flex' : 'none';
  document.getElementById('vue-plan').style.display = v==='plan' ? 'block' : 'none';
  document.querySelectorAll('.mnv').forEach(function(n,i){
    n.classList.toggle('on', ['scan','plan'][i]===v);
  });
}

function hlTable(num){
  document.querySelectorAll('[id^="pt-"] circle').forEach(function(c){
    c.setAttribute('fill','rgba(255,252,248,.12)');
    c.setAttribute('stroke','rgba(255,220,180,.3)');
    c.setAttribute('stroke-width','1');
  });
  var el = document.getElementById('pt-'+num);
  if(!el) return;
  var circle = el.querySelector('circle');
  if(circle){
    circle.setAttribute('fill','rgba(60,140,40,.4)');
    circle.setAttribute('stroke','#3a7020');
    circle.setAttribute('stroke-width','2.5');
  }
}

function hlTableByName(name){
  var num = name.replace(/\D/g,'');
  if(num){ hlTable(parseInt(num)); showVue('plan'); }
}

/* Afficher nav après PIN */
document.getElementById('pin-btn').addEventListener('click', function(){
  setTimeout(function(){
    if(document.getElementById('scan-screen').style.display==='flex'){
      document.getElementById('main-nav').classList.add('show');
    }
  }, 100);
});
</script>
</body>
</html>
