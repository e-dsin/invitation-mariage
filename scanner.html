<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>Scanner — Lynda & Marcel-Cédric</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;min-height:100dvh;background:#1a1a2e;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;}
#app{width:100%;max-width:430px;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;}

/* PIN */
#pin-screen{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;}
.pin-title{font-family:'Dancing Script',cursive;font-size:28px;color:rgba(255,240,220,.9);text-align:center;}
.pin-sub{font-size:12px;font-style:italic;color:rgba(255,240,220,.45);text-align:center;}
#pin-row{display:flex;gap:12px;justify-content:center;}
.pd{width:52px;height:60px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,220,180,.2);border-radius:12px;text-align:center;font-size:26px;font-weight:700;color:#fff5ee;outline:none;transition:border-color .2s;}
.pd:focus{border-color:rgba(255,180,100,.6);}
.pd.err{border-color:rgba(220,60,60,.7);animation:errShake .3s;}
#pin-btn{width:100%;max-width:260px;padding:13px;background:linear-gradient(135deg,#c2410c,#9a3412);border:none;border-radius:12px;color:#fff5ee;font-family:Georgia,serif;font-size:16px;cursor:pointer;}
#pin-err{font-size:12px;color:rgba(220,80,60,.8);font-style:italic;min-height:16px;text-align:center;}

/* SCANNER */
#scan-screen{display:none;flex-direction:column;align-items:center;width:100%;gap:16px;}
.scan-title{font-family:'Dancing Script',cursive;font-size:24px;color:rgba(255,240,220,.85);text-align:center;}
#cam-wrap{position:relative;width:100%;max-width:340px;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#000;}
#cam{width:100%;height:100%;object-fit:cover;display:block;}
#cam-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.scan-frame{width:200px;height:200px;border:2.5px solid rgba(255,180,80,.7);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);}
.scan-line{position:absolute;width:180px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,180,80,.9),transparent);animation:scanLine 2s ease-in-out infinite;}
@keyframes scanLine{0%,100%{top:calc(50% - 90px)}50%{top:calc(50% + 90px)}}

/* Résultat */
#result-wrap{width:100%;max-width:340px;border-radius:16px;padding:22px 20px;text-align:center;display:none;animation:popIn .35s cubic-bezier(.2,0,.2,1);}
#result-wrap.granted{background:rgba(40,140,60,.25);border:2px solid rgba(60,180,80,.5);}
#result-wrap.already{background:rgba(180,80,20,.22);border:2px solid rgba(210,100,40,.45);}
#result-wrap.unconfirmed{background:rgba(180,140,20,.22);border:2px solid rgba(210,170,40,.45);}
#result-wrap.invalid{background:rgba(120,20,20,.25);border:2px solid rgba(180,40,40,.45);}
#result-icon{font-size:48px;margin-bottom:8px;}
#result-name{font-family:'Dancing Script',cursive;font-size:28px;color:#fff5ee;margin-bottom:4px;}
#result-status{font-size:13px;color:rgba(255,240,220,.8);line-height:1.6;}
#result-time{font-size:11px;font-style:italic;color:rgba(255,240,220,.45);margin-top:6px;}
.scan-count{font-size:11px;font-style:italic;color:rgba(255,240,220,.35);text-align:center;}

@keyframes errShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}

#logout-btn{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,220,180,.15);border-radius:8px;padding:5px 10px;color:rgba(255,240,220,.4);font-size:10px;cursor:pointer;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">

  <!-- PIN -->
  <div id="pin-screen">
    <div class="pin-title">Contrôle d'accès</div>
    <div class="pin-sub">Lynda &amp; Marcel-Cédric se marient</div>
    <div id="pin-row">
      <input class="pd" id="p0" maxlength="1" type="tel" inputmode="numeric">
      <input class="pd" id="p1" maxlength="1" type="tel" inputmode="numeric">
      <input class="pd" id="p2" maxlength="1" type="tel" inputmode="numeric">
      <input class="pd" id="p3" maxlength="1" type="tel" inputmode="numeric">
    </div>
    <div id="pin-err"></div>
    <button id="pin-btn">Accéder au scanner</button>
  </div>

  <!-- SCANNER -->
  <div id="scan-screen">
    <button id="logout-btn">⏻ Quitter</button>
    <div class="scan-title">Scanner l'invitation</div>
    <div id="cam-wrap">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="cam-canvas" style="display:none;"></canvas>
      <div id="cam-overlay"><div class="scan-frame"></div><div class="scan-line"></div></div>
    </div>
    <div id="result-wrap">
      <div id="result-icon"></div>
      <div id="result-name"></div>
      <div id="result-status"></div>
      <div id="result-time"></div>
    </div>
    <div class="scan-count" id="scan-count">En attente de scan…</div>
  </div>

</div>

<script>
    (function(){
  var scannerPin='';
  var scanCount=0;
  var lastScan='';
  var lastScanTime=0;
  var scanCooldown=3000;
  var scanActive=true;
  var animTimer=null;
  var scanTimer=null;
  var timeoutTimer=null;
  var detector=null;

  /* ── PIN ── */
  var pds=['p0','p1','p2','p3'].map(function(id){return document.getElementById(id);});
  pds.forEach(function(inp,i){
    inp.addEventListener('keydown',function(e){
      if(e.key==='Backspace'){if(inp.value){inp.value='';}else if(i>0){pds[i-1].focus();pds[i-1].value='';}e.preventDefault();}
      if(e.key==='Enter')checkPin();
    });
    inp.addEventListener('input',function(){var v=inp.value.replace(/\D/g,'').slice(-1);inp.value=v;if(v&&i<3)pds[i+1].focus();});
  });
  document.getElementById('pin-btn').addEventListener('click',checkPin);

  function checkPin(){
    var c=pds.map(function(d){return d.value;}).join('');
    if(c.length<4){pds.forEach(function(d){d.classList.add('err');setTimeout(function(){d.classList.remove('err');},300);});return;}
    scannerPin=c;
    startScanner();
  }

  /* ── SCANNER ── */
  function startScanner(){
    document.getElementById('pin-screen').style.display='none';
    document.getElementById('scan-screen').style.display='flex';

    /* Vérifier support BarcodeDetector */
    if(!('BarcodeDetector' in window)){
      document.getElementById('scan-count').textContent='Navigateur non compatible — utilisez Chrome Android';
      return;
    }

    detector=new BarcodeDetector({formats:['qr_code']});

    var video=document.getElementById('cam');
    navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}
    })
    .then(function(stream){
      video.srcObject=stream;
      video.play();
      video.addEventListener('playing',function(){
        document.getElementById('scan-count').textContent='Caméra active — approchez le QR code';
        startScanLoop();
        startTimeout();
      });
    })
    .catch(function(e){
      document.getElementById('scan-count').textContent='Erreur caméra : '+e.message;
    });
  }

  function startScanLoop(){
    scanTimer=setInterval(function(){
      if(!scanActive) return;
      var video=document.getElementById('cam');
      detector.detect(video)
      .then(function(codes){
        if(codes.length>0){
          var data=codes[0].rawValue;
          var now=Date.now();
          if(data!==lastScan||now-lastScanTime>scanCooldown){
            lastScan=data;lastScanTime=now;
            clearTimeout(timeoutTimer);
            processQR(data);
          }
        }
      })
      .catch(function(){});
    },300);
  }

  function startTimeout(){
    timeoutTimer=setTimeout(function(){
      if(!lastScan){
        showResult('timeout',{});
        scanActive=false;
        clearTimeout(animTimer);
        animTimer=setTimeout(function(){
          document.getElementById('result-wrap').style.display='none';
          document.getElementById('scan-count').textContent='En attente de scan…';
          scanActive=true;
          lastScan='';
          startTimeout();
        },3500);
      }
    },10000);
  }

  function processQR(data){
    try{
      var url=new URL(data);
      var guestToken=url.searchParams.get('g');
      var evt=url.searchParams.get('e');
      if(!guestToken||!evt){showResult('invalid',{});return;}
      scanActive=false;
      fetch('/.netlify/functions/check-entry',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({guestToken:guestToken,event:evt,pin:scannerPin})
      })
      .then(function(r){return r.json();})
      .then(function(data){
        if(data.error==='PIN invalide'){
          document.getElementById('pin-screen').style.display='flex';
          document.getElementById('scan-screen').style.display='none';
          document.getElementById('pin-err').textContent='PIN invalide — reconnectez-vous';
          scannerPin='';pds.forEach(function(d){d.value='';});
          return;
        }
        showResult(data.status,data);
        scanCount++;
        document.getElementById('scan-count').textContent=scanCount+' scan'+(scanCount>1?'s':'')+' effectué'+(scanCount>1?'s':'');
        clearTimeout(animTimer);
        animTimer=setTimeout(function(){
          document.getElementById('result-wrap').style.display='none';
          scanActive=true;
          lastScan='';
          startTimeout();
        },3500);
      })
      .catch(function(){showResult('invalid',{});scanActive=true;});
    }catch(e){showResult('invalid',{});scanActive=true;}
  }

  function showResult(status,data){
    var wrap=document.getElementById('result-wrap');
    var icon=document.getElementById('result-icon');
    var name=document.getElementById('result-name');
    var st=document.getElementById('result-status');
    var tm=document.getElementById('result-time');
    wrap.className='';wrap.style.display='block';
    var evtLabel=data.event==='ck1'?'Cocktail famille':'Repas de mariage';
    if(status==='granted'){
      wrap.classList.add('granted');icon.textContent='✅';
      name.textContent=data.prenom||'';st.textContent='Accès '+evtLabel+' autorisé';tm.textContent=data.scanned_at||'';
    }else if(status==='already_scanned'){
      wrap.classList.add('already');icon.textContent='🔴';
      name.textContent=data.prenom||'';st.textContent='Déjà enregistré — '+evtLabel;tm.textContent='Premier accès le '+data.scanned_at;
    }else if(status==='unconfirmed'){
      wrap.classList.add('unconfirmed');icon.textContent='⚠️';
      name.textContent=data.prenom||'';st.textContent='Invité non confirmé';tm.textContent=data.reason||'';
    }else if(status==='timeout'){
      wrap.classList.add('invalid');icon.textContent='⏱️';
      name.textContent='';st.textContent='Aucun QR code détecté';tm.textContent='Réessayez en approchant le QR code';
    }else{
      wrap.classList.add('invalid');icon.textContent='❌';
      name.textContent='';st.textContent='QR code invalide';tm.textContent='';
    }
    wrap.style.animation='none';void wrap.offsetWidth;wrap.style.animation='popIn .35s cubic-bezier(.2,0,.2,1)';
  }

  document.getElementById('logout-btn').addEventListener('click',function(){location.reload();});

})();
</script>
</body>
</html>
