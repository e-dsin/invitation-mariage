<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rapport IP — Lynda & Marcel-Cédric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/dark/main.css">
<script src="https://js.arcgis.com/4.29/"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:Georgia,serif;}
body{background:#1a1a2e;}

/* ── PIN ── */
#pin-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;background:rgba(0,0,0,.6);z-index:200;}
.pin-title{font-family:'Dancing Script',cursive;font-size:30px;color:rgba(255,240,220,.95);text-align:center;}
.pin-sub{font-size:12px;font-style:italic;color:rgba(255,240,220,.5);text-align:center;}
#pin-row{display:flex;gap:12px;justify-content:center;}
.pd{width:52px;height:60px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,220,180,.25);border-radius:12px;text-align:center;font-size:26px;font-weight:700;color:#fff5ee;outline:none;transition:border-color .2s;}
.pd:focus{border-color:rgba(255,180,100,.7);}
.pd.err{border-color:rgba(220,60,60,.8);animation:errShake .3s;}
#pin-btn{padding:13px 40px;background:linear-gradient(135deg,#c2410c,#9a3412);border:none;border-radius:12px;color:#fff5ee;font-family:Georgia,serif;font-size:16px;cursor:pointer;}
#pin-err{font-size:12px;color:rgba(220,80,60,.9);font-style:italic;min-height:16px;text-align:center;}

/* ── STAGE ── */
#stage{position:fixed;inset:0;display:none;flex-direction:column;}

/* Header */
#stage-header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(20,15,35,.9);border-bottom:1px solid rgba(255,220,180,.08);z-index:20;}
#stage-title{font-family:'Dancing Script',cursive;font-size:20px;color:rgba(255,230,180,.85);}
.header-right{display:flex;align-items:center;gap:10px;}
#refresh-btn{background:rgba(255,180,80,.12);border:1px solid rgba(255,180,80,.18);border-radius:7px;padding:4px 10px;color:rgba(255,200,120,.7);font-size:10px;cursor:pointer;font-style:italic;}
#quit-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,220,180,.1);border-radius:8px;padding:5px 12px;color:rgba(255,230,180,.5);font-size:11px;cursor:pointer;}

/* ── LAYOUT carte + tableau ── */
#content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
#map-container{flex:0 0 58%;position:relative;min-height:0;}
#arcgis-map{width:100%;height:100%;}

/* Loading overlay */
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,10,30,.8);z-index:50;gap:12px;pointer-events:none;}
.load-spinner{width:34px;height:34px;border:2.5px solid rgba(255,180,80,.15);border-top-color:rgba(255,180,80,.75);border-radius:50%;animation:spin .9s linear infinite;}
.load-txt{font-style:italic;font-size:12px;color:rgba(255,220,180,.55);}
.load-prog{font-size:11px;color:rgba(255,180,80,.5);}

/* ── TABLE ARCGIS ── */
#table-container{flex:1;overflow:hidden;min-height:0;border-top:1px solid rgba(255,220,180,.1);}

/* Surcharge style ArcGIS FeatureTable */
.esri-feature-table{background:#1a1a2e!important;color:rgba(255,230,180,.85)!important;}
.esri-feature-table__header{background:rgba(20,15,35,.95)!important;border-bottom:1px solid rgba(255,220,180,.12)!important;}
.esri-feature-table__loader{background:#1a1a2e!important;}
.esri-grid__header-cell{background:rgba(30,20,50,.9)!important;color:rgba(255,200,120,.8)!important;font-family:Georgia,serif!important;font-style:italic!important;font-size:11px!important;}
.esri-grid__body-row:hover{background:rgba(255,180,80,.06)!important;}
.esri-grid__body-row--selected{background:rgba(255,140,40,.15)!important;}
.esri-grid__body-cell{color:rgba(255,220,180,.75)!important;font-size:11px!important;border-bottom:1px solid rgba(255,220,180,.05)!important;}
.esri-feature-table__toolbar{background:rgba(20,15,35,.95)!important;border-bottom:1px solid rgba(255,220,180,.08)!important;}
.esri-button--tertiary{color:rgba(255,200,120,.7)!important;}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes errShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body>

<!-- PIN -->
<div id="pin-screen">
  <div class="pin-title">Rapport IP</div>
  <div class="pin-sub">Lynda &amp; Marcel-Cédric · Accès sécurisé</div>
  <div id="pin-row">
    <input class="pd" id="p0" maxlength="1" type="tel" inputmode="numeric">
    <input class="pd" id="p1" maxlength="1" type="tel" inputmode="numeric">
    <input class="pd" id="p2" maxlength="1" type="tel" inputmode="numeric">
    <input class="pd" id="p3" maxlength="1" type="tel" inputmode="numeric">
  </div>
  <div id="pin-err"></div>
  <button id="pin-btn">Accéder au rapport</button>
</div>

<!-- STAGE -->
<div id="stage">
  <div id="stage-header">
    <div id="stage-title">Rapport IP · Connexions</div>
    <div class="header-right">
      <button id="refresh-btn">↺ Actualiser</button>
      <button id="quit-btn">✕ Quitter</button>
    </div>
  </div>
  <div id="content">
    <div id="map-container">
      <div id="arcgis-map"></div>
      <div id="loading">
        <div class="load-spinner"></div>
        <div class="load-txt">Géolocalisation des adresses IP…</div>
        <div class="load-prog" id="load-prog"></div>
      </div>
    </div>
    <div id="table-container"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════
   CONSTANTES
════════════════════════════════════════════ */
var ARCGIS_API_KEY = 'AAPTan5QhTRTt-XEPphTzyrFtKA..DsL6PBNPN8nN8WQfKKSSfMnOCwMngfyq2OwNehbAnDcapmQScCwy23KgzbP6tXi9VIdWOylc2Jqefced9Dlf8TU6y5j5bMNDyeWpItKBUxNK5R8AgtKqYlmz8pMxxyZZoVt_-11gzapqpTjX21JxrbA2WMYWxLnLc7IELEs7tVlluUDs8Yctp5ORS2faKuBkogCCk4VOynic6qqShFPpysD9pMZixF8zapeNGuu9qAzfklXFf_O2pH6PMA..AT1_KMQaRDlb';
var SESSION_KEY    = 'rapport_ip_dict_arcgis';
var IP_COLORS      = {green:'#3a7020', orange:'#c87010', red:'#c02020'};
var IP_LABELS      = {green:'IP stable', orange:'Changement < 100m', red:'Changement > 100m'};
var ORDER          = {red:0, orange:1, green:2};

/* ════════════════════════════════════════════
   ÉTAT
════════════════════════════════════════════ */
var adminPin    = '';
var guestDict   = null;
var arcgisView  = null;
var featureLayer= null;
var featureTable= null;
var highlight   = null;

/* ════════════════════════════════════════════
   PIN — même logique que messages.html
════════════════════════════════════════════ */
var pds = ['p0','p1','p2','p3'].map(function(id){ return document.getElementById(id); });
pds.forEach(function(inp, i){
  inp.addEventListener('keydown', function(e){
    if(e.key==='Backspace'){ if(inp.value){ inp.value=''; } else if(i>0){ pds[i-1].focus(); pds[i-1].value=''; } e.preventDefault(); }
    if(e.key==='Enter') checkPin();
  });
  inp.addEventListener('input', function(){
    var v = inp.value.replace(/\D/g,'').slice(-1); inp.value=v;
    if(v && i<3) pds[i+1].focus();
  });
});
document.getElementById('pin-btn').addEventListener('click', checkPin);

function checkPin(){
  var c = pds.map(function(d){ return d.value; }).join('');
  if(c.length < 4){
    pds.forEach(function(d){ d.classList.add('err'); setTimeout(function(){ d.classList.remove('err'); }, 300); });
    return;
  }
  adminPin = c;
  loadData(false);
}

/* ════════════════════════════════════════════
   FONCTION 1 — buildGuestData
   Géolocalise les IPs et construit le dictionnaire JSON.
   Persisté en sessionStorage.
════════════════════════════════════════════ */
async function buildGuestData(rawGuests) {
  var withIp = rawGuests.filter(function(g){ return g.ip_status && g.adr_ip; });
  withIp.sort(function(a,b){ return (ORDER[a.ip_status]||2)-(ORDER[b.ip_status]||2); });

  var result = { guests: [], generated_at: new Date().toISOString() };
  var total  = withIp.length;
  var progEl = document.getElementById('load-prog');

  /* Géoloc par batch de 4 */
  var BATCH = 4;
  for(var i=0; i<withIp.length; i+=BATCH){
    var batch = withIp.slice(i, i+BATCH);
    var batchResults = await Promise.all(batch.map(function(g){
      return fetch('https://ip-api.com/json/'+encodeURIComponent(g.adr_ip.split(',')[0].trim())
        +'?fields=lat,lon,status,city,country,regionName')
        .then(function(r){ return r.json(); })
        .then(function(geo){
          return {
            prenom:               g.prenom               || '',
            adr_ip:               g.adr_ip               || '',
            ip_status:            g.ip_status            || 'green',
            ip_log:               g.ip_log               || '',
            timestamp_first_click:g.timestamp_first_click|| '',
            lat:     geo.status==='success' ? geo.lat    : null,
            lon:     geo.status==='success' ? geo.lon    : null,
            city:    geo.status==='success' ? geo.city   : '',
            region:  geo.status==='success' ? geo.regionName : '',
            country: geo.status==='success' ? geo.country: '',
          };
        })
        .catch(function(){ return null; });
    }));
    batchResults.forEach(function(e){ if(e && e.lat !== null) result.guests.push(e); });
    if(progEl){ var done=Math.min(i+BATCH,total); progEl.textContent=done+' / '+total+' adresses traitées'; }
    if(i+BATCH < withIp.length) await pause(400);
  }

  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(result)); } catch(e){}
  return result;
}

/* ════════════════════════════════════════════
   FONCTION 2 — renderFeatures(dict)
   Crée le FeatureLayer ArcGIS (feature class point)
   avec UniqueValueRenderer + FeatureTable widget.
════════════════════════════════════════════ */
function renderFeatures(dict) {
  require([
    'esri/config',
    'esri/Map',
    'esri/views/MapView',
    'esri/layers/FeatureLayer',
    'esri/Graphic',
    'esri/widgets/FeatureTable',
    'esri/widgets/Legend',
    'esri/widgets/Home',
  ], function(esriConfig, Map, MapView, FeatureLayer, Graphic, FeatureTable, Legend, Home) {

    esriConfig.apiKey = ARCGIS_API_KEY;

    /* ── 1. Construire les Graphics (feature class points) ── */
    var graphics = dict.guests.map(function(g, i){
      return new Graphic({
        geometry: { type:'point', longitude: g.lon, latitude: g.lat },
        attributes: {
          ObjectID:              i,
          prenom:                g.prenom,
          ip_status:             g.ip_status,
          statut_label:          IP_LABELS[g.ip_status] || g.ip_status,
          adr_ip:                g.adr_ip,
          ville:                 [g.city, g.country].filter(Boolean).join(', '),
          timestamp_changement:  (g.ip_status !== 'green' && g.ip_log) ? g.ip_log.split(' — ')[0]||'' : '—',
          premier_acces:         g.timestamp_first_click || '—',
        }
      });
    });

    /* ── 2. UniqueValueRenderer — couleur selon ip_status ── */
    var renderer = {
      type: 'unique-value',
      field: 'ip_status',
      uniqueValueInfos: [
        {
          value: 'green',
          label: 'IP stable',
          symbol: { type:'simple-marker', color:'#3a7020', size:10, outline:{ color:'rgba(255,255,255,.6)', width:1.5 } }
        },
        {
          value: 'orange',
          label: 'Changement < 100m',
          symbol: { type:'simple-marker', color:'#c87010', size:12, outline:{ color:'rgba(255,255,255,.6)', width:1.5 } }
        },
        {
          value: 'red',
          label: 'Changement > 100m',
          symbol: { type:'simple-marker', color:'#c02020', size:14, outline:{ color:'rgba(255,255,255,.8)', width:2 } }
        }
      ]
    };

    /* ── 3. PopupTemplate ── */
    var popupTemplate = {
      title: '{prenom}',
      content: [{ type:'fields', fieldInfos:[
        { fieldName:'statut_label',         label:'Statut IP' },
        { fieldName:'adr_ip',               label:'Adresse IP' },
        { fieldName:'ville',                label:'Localisation' },
        { fieldName:'premier_acces',        label:'Premier accès' },
        { fieldName:'timestamp_changement', label:'Changement détecté' },
      ]}]
    };

    /* ── 4. FeatureLayer client-side (feature class point) ── */
    var layer = new FeatureLayer({
      source:        graphics,
      geometryType:  'point',
      spatialReference: { wkid: 4326 },
      objectIdField: 'ObjectID',
      fields: [
        { name:'ObjectID',              type:'oid' },
        { name:'prenom',                type:'string', alias:'Prénom' },
        { name:'ip_status',             type:'string', alias:'Statut' },
        { name:'statut_label',          type:'string', alias:'Statut détaillé' },
        { name:'adr_ip',                type:'string', alias:'Adresse IP' },
        { name:'ville',                 type:'string', alias:'Ville / Pays' },
        { name:'timestamp_changement',  type:'string', alias:'Changement IP' },
        { name:'premier_acces',         type:'string', alias:'Premier accès' },
      ],
      renderer:      renderer,
      popupTemplate: popupTemplate,
      outFields:     ['*'],
    });

    /* ── 5. Map + MapView ── */
    var map = new Map({
      basemap: 'dark-gray-vector',
      layers:  [layer],
    });

    if(arcgisView){ arcgisView.destroy(); }
    arcgisView = new MapView({
      container: 'arcgis-map',
      map:       map,
      zoom:      4,
      center:    [2.5, 46.5],
      ui: { components: ['zoom'] }
    });

    /* ── 6. Widgets ── */
    var legend = new Legend({ view: arcgisView, container: document.createElement('div') });
    arcgisView.ui.add(legend, 'bottom-right');

    var home = new Home({ view: arcgisView });
    arcgisView.ui.add(home, 'top-left');

    /* ── 7. FeatureTable widget (objet ArcGIS de type table) ── */
    if(featureTable){ featureTable.destroy(); }
    featureTable = new FeatureTable({
      view:      arcgisView,
      layer:     layer,
      container: document.getElementById('table-container'),
      visibleElements: { selectionColumn: true, header: true },
      columnTemplates: [
        { type:'field', fieldName:'prenom',               label:'Prénom',        width:100 },
        { type:'field', fieldName:'statut_label',         label:'Statut',        width:140 },
        { type:'field', fieldName:'ville',                label:'Localisation',  width:150 },
        { type:'field', fieldName:'adr_ip',               label:'IP',            width:120 },
        { type:'field', fieldName:'premier_acces',        label:'1er accès',     width:130 },
        { type:'field', fieldName:'timestamp_changement', label:'Changement',    width:130 },
      ],
      multiSortEnabled: true,
    });

    /* ── 8. Interaction croisée carte ↔ tableau ── */
    /* Clic sur la carte → sélectionner la ligne dans le tableau */
    arcgisView.on('click', function(event){
      arcgisView.hitTest(event).then(function(response){
        var result = response.results.filter(function(r){ return r.layer === layer; })[0];
        if(!result) return;
        var oid = result.graphic.attributes.ObjectID;
        featureTable.highlightIds.removeAll();
        featureTable.highlightIds.add(oid);
        /* Centrer la vue sur le point cliqué */
        arcgisView.goTo({ target: result.graphic, zoom: 10 }, { duration: 800 });
      });
    });

    /* Sélection dans le tableau → zoom sur la carte */
    featureTable.on('selection-change', function(event){
      if(event.added && event.added.length > 0){
        var oid = event.added[0].objectId;
        layer.queryFeatures({ objectIds:[oid], returnGeometry:true, outFields:['*'] })
          .then(function(result){
            if(result.features.length > 0){
              if(highlight) highlight.remove();
              arcgisView.whenLayerView(layer).then(function(lv){
                highlight = lv.highlight(result.features[0]);
              });
              arcgisView.goTo({ target: result.features[0].geometry, zoom: 10 }, { duration: 800 });
            }
          });
      }
    });

    /* Masquer le loading une fois la vue chargée */
    arcgisView.when(function(){
      var loadingEl = document.getElementById('loading');
      if(loadingEl) loadingEl.style.display = 'none';
      /* Zoomer sur l'étendue des points */
      arcgisView.goTo({ target: layer });
    });

    featureLayer = layer;
  });
}

/* ════════════════════════════════════════════
   CHARGEMENT PRINCIPAL
════════════════════════════════════════════ */
async function loadData(forceRefresh) {
  var pinBtn = document.getElementById('pin-btn');
  if(pinBtn){ pinBtn.textContent='Chargement…'; pinBtn.disabled=true; }

  var raw;
  try {
    var r = await fetch('/.netlify/functions/admin-list-guests',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pin: adminPin})
    });
    raw = await r.json();
  } catch(e) {
    document.getElementById('pin-err').textContent = 'Erreur de connexion';
    if(pinBtn){ pinBtn.textContent='Accéder au rapport'; pinBtn.disabled=false; }
    return;
  }

  if(raw.error){
    document.getElementById('pin-err').textContent = 'PIN invalide';
    if(pinBtn){ pinBtn.textContent='Accéder au rapport'; pinBtn.disabled=false; }
    adminPin=''; pds.forEach(function(d){ d.value=''; });
    return;
  }

  /* Afficher le stage */
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('stage').style.display = 'flex';
  document.getElementById('loading').style.display = 'flex';

  /* Vérifier sessionStorage */
  var cached = null;
  if(!forceRefresh){
    try {
      var stored = sessionStorage.getItem(SESSION_KEY);
      if(stored){ cached = JSON.parse(stored); }
    } catch(e){}
  }

  if(cached && cached.guests && cached.guests.length){
    document.getElementById('loading').style.display = 'none';
    guestDict = cached;
    renderFeatures(guestDict);
    return;
  }

  /* Construire le dictionnaire */
  guestDict = await buildGuestData(raw.guests || []);
  document.getElementById('loading').style.display = 'none';
  renderFeatures(guestDict);
}

/* Bouton actualiser */
document.getElementById('refresh-btn').addEventListener('click', function(){
  try { sessionStorage.removeItem(SESSION_KEY); } catch(e){}
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('load-prog').textContent = '';
  loadData(true);
});

document.getElementById('quit-btn').addEventListener('click', function(){ location.reload(); });

function pause(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
</script>
</body>
</html>
